<div class="app-layout">
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">AP</div>
        <div class="brand-text">
          <h2>ALTO PORTE</h2>
          <span>Módulo de Seguimiento de Leads Inmobiliarios</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="system-status">
          <span class="pulse-dot"></span> API Conectada
        </span>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="content-container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard Comercial</h1>
          <p class="page-description">
            Monitoreo de prospectos, valor de mercado e indicadores de
            conversión
          </p>
        </div>
      </div>

      <app-metrics-overview
        [summary]="summary"
        [loading]="loadingSummary"
      ></app-metrics-overview>

      <app-lead-filter
        (filterChange)="onFilterChange($event)"
        (openNewLeadModal)="openModal()"
      ></app-lead-filter>

      <app-lead-list
        [leads]="leads"
        [totalLeads]="totalLeads"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [limit]="limit"
        [loading]="loadingLeads"
        [error]="errorLeads"
        [sortBy]="currentFilters.sortBy || 'createdAt'"
        [order]="currentFilters.order || 'desc'"
        (pageChange)="onPageChange($event)"
        (limitChange)="onLimitChange($event)"
        (sortChange)="onSortChange($event)"
        (statusUpdate)="onStatusUpdate($event)"
        (retry)="loadLeads()"
      ></app-lead-list>
    </div>
  </main>

  <div
    class="toast-notification"
    *ngIf="toastMessage"
    [ngClass]="toastMessage.type"
  >
    <span class="toast-icon" *ngIf="toastMessage.type === 'success'">✓</span>
    <span class="toast-icon" *ngIf="toastMessage.type === 'error'">✕</span>
    <span>{{ toastMessage.text }}</span>
  </div>

  <app-lead-form
    *ngIf="showFormModal"
    [submitting]="submittingLead"
    (saveLead)="onSaveLead($event)"
    (cancel)="closeModal()"
  ></app-lead-form>

  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; 2026 Alto Porte | Evaluativo Full Stack Developer</p>
    </div>
  </footer>
</div>
