<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="modal-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" y1="8" x2="19" y2="14" />
            <line x1="16" y1="11" x2="22" y2="11" />
          </svg>
        </div>
        <div>
          <h3>Registrar Nuevo Lead</h3>
          <p class="modal-subtitle">
            Ingrese la información del prospecto interesado
          </p>
        </div>
      </div>
      <button class="close-btn" (click)="onCancel()" aria-label="Cerrar">
        &times;
      </button>
    </div>

    <form [formGroup]="leadForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-grid">
        <div class="form-field full-width">
          <label for="name"
            >Nombre Completo <span class="required">*</span></label
          >
          <input
            id="name"
            type="text"
            formControlName="name"
            class="form-control"
            [class.is-invalid]="submitted && f['name'].errors"
            placeholder="Ej. Carlos Mendoza"
          />
          <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
            <span *ngIf="f['name'].errors['required']"
              >El nombre es obligatorio.</span
            >
            <span *ngIf="f['name'].errors['minlength']"
              >Mínimo 2 caracteres.</span
            >
          </div>
        </div>

        <div class="form-field">
          <label for="email"
            >Correo Electrónico <span class="required">*</span></label
          >
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="submitted && f['email'].errors"
            placeholder="carlos@example.com"
          />
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <span *ngIf="f['email'].errors['required']"
              >El correo es obligatorio.</span
            >
            <span *ngIf="f['email'].errors['email']"
              >Ingrese un correo válido.</span
            >
          </div>
        </div>

        <div class="form-field">
          <label for="phone">Teléfono de Contacto</label>
          <input
            id="phone"
            type="text"
            formControlName="phone"
            class="form-control"
            placeholder="Ej. 7000-1001"
          />
        </div>

        <div class="form-field">
          <label for="budget"
            >Presupuesto (USD) <span class="required">*</span></label
          >
          <input
            id="budget"
            type="number"
            formControlName="budget"
            class="form-control"
            [class.is-invalid]="submitted && f['budget'].errors"
            placeholder="150000"
          />
          <div *ngIf="submitted && f['budget'].errors" class="invalid-feedback">
            <span *ngIf="f['budget'].errors['required']"
              >El presupuesto es obligatorio.</span
            >
            <span *ngIf="f['budget'].errors['min']"
              >Debe ser un número mayor a cero.</span
            >
          </div>
        </div>

        <div class="form-field">
          <label for="source"
            >Fuente / Origen <span class="required">*</span></label
          >
          <select id="source" formControlName="source" class="form-control">
            <option *ngFor="let s of sourceOptions" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="form-field">
          <label for="project"
            >Proyecto Inmobiliario <span class="required">*</span></label
          >
          <select id="project" formControlName="project" class="form-control">
            <option *ngFor="let p of projectOptions" [value]="p">
              {{ p }}
            </option>
          </select>
        </div>

        <div class="form-field">
          <label for="status"
            >Estado Inicial <span class="required">*</span></label
          >
          <select id="status" formControlName="status" class="form-control">
            <option *ngFor="let st of statusOptions" [value]="st">
              {{ st }}
            </option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="submitting"
        >
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          <span *ngIf="!submitting">Guardar Lead</span>
          <span *ngIf="submitting" class="spinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
