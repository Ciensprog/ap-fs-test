<div class="filter-card">
  <div class="filter-header">
    <div class="filter-title-group">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
      </svg>
      <h4>Filtros y Búsqueda</h4>
    </div>
    <button class="btn btn-primary" (click)="openNewLeadModal.emit()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      Nuevo Lead
    </button>
  </div>

  <div class="filter-controls">
    <div class="form-group search-group">
      <label>Buscar</label>
      <div class="input-with-icon">
        <svg
          class="input-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          type="text"
          class="form-control"
          placeholder="Nombre o correo..."
          [value]="filters.search"
          (input)="onSearchInput($event)"
        />
      </div>
    </div>

    <div class="form-group">
      <label>Estado Commercial</label>
      <select
        class="form-control"
        [(ngModel)]="filters.status"
        (change)="onFilterChange()"
      >
        <option value="">Todos los Estados</option>
        <option *ngFor="let st of statusOptions" [value]="st">{{ st }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Fuente / Origen</label>
      <select
        class="form-control"
        [(ngModel)]="filters.source"
        (change)="onFilterChange()"
      >
        <option value="">Todas las Fuentes</option>
        <option *ngFor="let src of sourceOptions" [value]="src">
          {{ src }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Proyecto Inmobiliario</label>
      <select
        class="form-control"
        [(ngModel)]="filters.project"
        (change)="onFilterChange()"
      >
        <option value="">Todos los Proyectos</option>
        <option *ngFor="let proj of projectOptions" [value]="proj">
          {{ proj }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Ordenar Por</label>
      <select
        class="form-control"
        [(ngModel)]="filters.sortBy"
        (change)="onFilterChange()"
      >
        <option value="createdAt">Fecha de Registro</option>
        <option value="budget">Presupuesto</option>
      </select>
    </div>

    <div class="form-group reset-group">
      <button
        class="btn btn-secondary"
        (click)="onReset()"
        title="Limpiar Filtros"
      >
        Limpiar Filtros
      </button>
    </div>
  </div>
</div>
